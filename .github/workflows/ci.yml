name: Research Lab checks
on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'schemas/**'
      - 'config/**'
      - 'pyproject.toml'
      - 'requirements-lock.txt'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'schemas/**'
      - 'config/**'
      - 'pyproject.toml'
      - 'requirements-lock.txt'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e . --no-build-isolation --no-deps
      - run: python -m ruff check src tests
      - run: python -m pytest -q
      - run: lab demo
      - run: lab schemas --output-dir outputs/schemas
      - name: Verify committed contracts
        run: python scripts/check_schemas.py
