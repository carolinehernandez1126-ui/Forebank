[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kraken-research-lab"
version = "0.1.0"
description = "Auditable research and dual-AI manual trade review for Kraken Pro"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0,<3", "pandas>=2.2,<3", "pydantic>=2.9,<3",
  "httpx>=0.27,<1", "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
lab = "research_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
